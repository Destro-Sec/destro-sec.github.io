<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Destro Sec</title>
<!-- GitHub Pages SPA redirect: store the requested path and send the user to index.html.
     The script in index.html reads this value and calls history.replaceState to restore the URL. -->
<script>
  sessionStorage.setItem('__ds_redirect', location.pathname + location.search + location.hash);
  location.replace('/');
</script>
</head>
<body></body>
</html>
