<!-- GitHub Pages SPA routing: restore path from redirect stored by 404.html -->
<script>
  (function() {
    var redir = sessionStorage.getItem('__ds_redirect');
    if (redir) {
      sessionStorage.removeItem('__ds_redirect');
      window.history.replaceState(null, '', redir);
    }
  })();
</script>
